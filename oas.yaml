openapi: 3.0.3
info:
  title: Simple Social Network API
  description: A RESTful API for a simple social network featuring cursor-based pagination.
  version: 1.0.0
servers:
  - url: https://api.socialnetwork.example.com/v1
    description: Production server

# Apply Bearer Auth globally by default
security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /users/me:
    patch:
      summary: Update current user's profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{username}:
    get:
      summary: Get a user's public profile
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /users/{username}/follow:
    post:
      summary: Follow a user
      tags: [Follows]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '204':
          description: Successfully followed
    delete:
      summary: Unfollow a user
      tags: [Follows]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
      responses:
        '204':
          description: Successfully unfollowed

  /users/{username}/followers:
    get:
      summary: Get list of followers
      tags: [Follows]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /users/{username}/following:
    get:
      summary: Get list of users this user is following
      tags: [Follows]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /users/{username}/posts:
    get:
      summary: Get a user's personal timeline
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'

  /feed:
    get:
      summary: Get chronological feed of followed users
      tags: [Feed]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'

  /posts:
    post:
      summary: Create a new post
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      summary: Get a specific post by ID
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
    delete:
      summary: Delete a post
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '204':
          description: Post deleted
        '403':
          description: Forbidden (Not the owner)

  /posts/{id}/likes:
    post:
      summary: Like a post
      tags: [Likes]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '204':
          description: Post liked
    delete:
      summary: Remove a like from a post
      tags: [Likes]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '204':
          description: Like removed
    get:
      summary: Get users who liked a post
      tags: [Likes]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'

  /posts/{id}/comments:
    post:
      summary: Add a comment to a post
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
    get:
      summary: Get comments for a post
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComments'

  /comments/{id}:
    delete:
      summary: Delete a comment
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/CommentIdParam'
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Forbidden (Not owner of comment or post)

  /messages:
    post:
      summary: Send a direct message
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /messages/conversations:
    get:
      summary: Get list of active conversations
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversations'

  /messages/with/{username}:
    get:
      summary: Get chat history with a specific user
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/UsernameParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessages'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsernameParam:
      name: username
      in: path
      required: true
      schema:
        type: string
      description: The user's unique username
    PostIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The post's unique identifier
    CommentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The comment's unique identifier
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Base64 encoded pointer to the next set of items
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 50
      description: Number of items to return

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        profile_image_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        followers_count:
          type: integer
        following_count:
          type: integer

    UserShort:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        profile_image_url:
          type: string
          format: uri
          nullable: true

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserShort'
        content:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        likes_count:
          type: integer
        comments_count:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserShort'
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        receiver_id:
          type: string
          format: uuid
        content:
          type: string
        sent_at:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserShort'
        last_message:
          $ref: '#/components/schemas/Message'

    PaginationMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        has_next:
          type: boolean

    # Paginated Wrappers
    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedPosts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedComments:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedMessages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedConversations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          format: password

    RegisterResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        profile_image_url:
          type: string
          format: uri
          maxLength: 1000

    CreatePostRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 5000
        image_url:
          type: string
          format: uri
          maxLength: 1000

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 3000

    SendMessageRequest:
      type: object
      required: [receiver_username, content]
      properties:
        receiver_username:
          type: string
        content:
          type: string
          maxLength: 3000